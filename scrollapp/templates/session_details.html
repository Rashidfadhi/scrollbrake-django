<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Details | ScrollBrake</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background: #1f2937;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            color: #60a5fa;
        }

        .detail {
            margin: 20px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #374151;
        }

        .label {
            color: #9ca3af;
        }

        .value {
            margin-top: 6px;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            margin-right: 12px;
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Session Details</h1>

        <div class="detail">
            <div class="label">Application</div>
            <div class="value">{{ session.app_name }}</div>
        </div>

        <div class="detail">
            <div class="label">Duration</div>
            <div class="value">{{ session.duration }} seconds</div>
        </div>

        <div class="detail">
            <div class="label">Scroll Count</div>
            <div class="value">{{ session.scroll_count }}</div>
        </div>

        <div class="detail">
            <div class="label">Momentum</div>
            <div class="value">{{ session.get_momentum_display }}</div>
        </div>

        <div class="detail">
            <div class="label">Created At</div>
            <div class="value">{{ session.created_at }}</div>
        </div>

        <a href="{% url 'session_list' %}">Back to Sessions</a>
        <a href="{% url 'update_session' session.pk %}">Edit Session</a>
    </div>
</body>
</html>

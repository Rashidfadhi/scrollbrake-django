
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Session | ScrollBrake</title>

    <style>
        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #0c1020;
            color: #e8edf7;
        }

        .container {
            max-width: 550px;
            margin: 60px auto;
            padding: 30px;
            background: #151d2e;
            border: 1px solid #293449;
            border-radius: 14px;
        }

        .warning {
            color: #ffb84d;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #dc4545;
            color: white;
            cursor: pointer;
        }

        .cancel {
            display: inline-block;
            margin-left: 12px;
            color: #8fbaff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1 class="warning">Delete Session?</h1>

        <p>
            Are you sure you want to delete the session for
            <strong>{{ session.app_name }}</strong>?
        </p>

        <p>This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'session_list' %}" class="cancel">
                Cancel
            </a>
        </form>
    </main>
</body>
</html>

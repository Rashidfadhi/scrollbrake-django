
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ScrollBrake</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d111d;
            color: #e5eaf5;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            padding: 30px;
            background: #151d2e;
            border: 1px solid #293449;
            border-radius: 14px;
        }

        h1 {
            color: #8fbaff;
            margin-top: 0;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            background: #0d111d;
            color: white;
            border: 1px solid #39465f;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6c8cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff8585;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>ScrollBrake</h1>
        <p>Sign in to your account</p>

        {% if form.errors %}
            <p class="error">
                Username or password is incorrect.
            </p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>

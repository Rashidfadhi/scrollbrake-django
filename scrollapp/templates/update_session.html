
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Session | ScrollBrake</title>
    <style>
        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #0c1020;
            color: #e8edf7;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: #151d2e;
            border: 1px solid #293449;
            border-radius: 14px;
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            background: #0c1020;
            color: white;
            border: 1px solid #35445f;
            border-radius: 8px;
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 13px;
            background: #3978e8;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #8fbaff;
        }

        .error-box {
            background: #3b1d25;
            border: 1px solid #ef4444;
            color: #fecaca;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-box p {
            font-weight: bold;
            margin-top: 0;
        }

        .error-box ul {
            margin-bottom: 0;
            padding-left: 20px;
        }

    </style>
</head>
<body>
    <main class="container">
        <h1>Update Scrolling Session</h1>
        <p>Edit the details for {{ session.app_name }}.</p>

        <form method="POST">
            {% csrf_token %}
            {% if form.errors %}
                <div class="error-box">
                    <p>Please correct the following errors:</p>
                    {{ form.errors }}
                </div>
            {% endif %}
            
            {{ form.as_p }}
            <button type="submit">Save Changes</button>


        </form>

        <a href="{% url 'session_list' %}">← Back to Sessions</a>
    </main>
</body>
</html>
